<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixelpusher — Hero Prototype</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/dw5/Metropolis@master/src/metropolis.css" />
  <style>
    /* ── TOKENS (mirrored from styles.css) ─────────────────── */
    :root {
      --ff:        'Helvetica Neue', Helvetica, Arial, sans-serif;
      --black:     #0B0B09;
      --off-white: #F5F0E8;
      --mid:       #7A756D;
      --accent:    #D94E2E;
      --gutter:    clamp(1.5rem, 5vw, 5rem);
      --hero-fs:   clamp(3rem, 13vw, 10.5rem);
      --label-fs:  0.8125rem;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--ff);
      background: var(--black);
      color: var(--off-white);
      cursor: none;
      overflow: hidden; /* prototype is hero-only */
    }

    /* ── CUSTOM CURSOR ──────────────────────────────────────── */
    .cursor {
      position: fixed;
      top: 0; left: 0;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--off-white);
      pointer-events: none;
      z-index: 9999;
      mix-blend-mode: difference;
      transform: translate(-50%, -50%);
      transition: width 0.2s ease, height 0.2s ease;
      will-change: transform;
    }
    .cursor.large { width: 48px; height: 48px; }

    @media (hover: none) {
      .cursor { display: none; }
      body { cursor: auto; }
    }

    /* ── HERO ───────────────────────────────────────────────── */
    .hero {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      background: var(--black);
      padding: 0 var(--gutter);
      padding-bottom: clamp(4.5rem, 9vh, 8rem);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
    }

    /* dot-grid canvas sits behind everything */
    #dot-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* text layer sits above canvas */
    .hero-content {
      position: relative;
      z-index: 1;
    }

    .hero-eyebrow {
      font-size: var(--label-fs);
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--mid);
      margin-bottom: 1.75rem;
      opacity: 0;
      transform: translateY(1rem);
      animation: fade-up 0.9s cubic-bezier(0.16,1,0.3,1) 0.2s forwards;
    }

    .hero-h1 {
      font-size: var(--hero-fs);
      font-weight: 700;
      line-height: 0.92;
      letter-spacing: -0.035em;
      text-transform: uppercase;
      /* scramble JS controls visibility; start hidden so no FOUC */
      opacity: 0;
    }
    .hero-h1.ready { opacity: 1; }

    .hero-sub {
      margin-top: clamp(2rem, 3vw, 3rem);
      font-size: clamp(1rem, 1.4vw, 1.2rem);
      line-height: 1.65;
      color: var(--mid);
      max-width: 40ch;
      opacity: 0;
      transform: translateY(1rem);
      animation: fade-up 1s cubic-bezier(0.16,1,0.3,1) 0.58s forwards;
    }

    .hero-scroll {
      position: absolute;
      bottom: clamp(2rem, 5vh, 3.5rem);
      right: var(--gutter);
      writing-mode: vertical-rl;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--mid);
      opacity: 0;
      animation: fade-in 1.2s ease 1.1s forwards;
      z-index: 1;
    }

    .hero-location {
      position: absolute;
      bottom: clamp(2rem, 5vh, 3.5rem);
      left: var(--gutter);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--mid);
      opacity: 0;
      animation: fade-in 1.2s ease 1.1s forwards;
      z-index: 1;
    }

    @keyframes fade-up {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fade-in {
      to { opacity: 0.35; }
    }

    /* ── PROTO CONTROLS (bottom-right toggle panel) ─────────── */
    .proto-panel {
      position: fixed;
      bottom: 2rem;
      right: 5rem; /* clear of scroll hint */
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.5rem;
      opacity: 0;
      animation: fade-in 0.8s ease 1.8s forwards;
    }
    .proto-label {
      font-family: 'Metropolis', var(--ff);
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--mid);
      margin-bottom: 0.25rem;
      opacity: 0.5;
    }
    .proto-toggle {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      cursor: none;
    }
    .proto-toggle span {
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--mid);
      transition: color 0.2s;
    }
    /* pill switch */
    .switch {
      position: relative;
      width: 30px; height: 16px;
      cursor: none;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0;
      background: #2a2a28;
      border: 1px solid #3a3a38;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .slider::before {
      content: '';
      position: absolute;
      width: 10px; height: 10px;
      left: 2px; top: 50%;
      transform: translateY(-50%);
      background: var(--mid);
      border-radius: 50%;
      transition: transform 0.2s, background 0.2s;
    }
    .switch input:checked + .slider { background: #1e1e1c; border-color: var(--accent); }
    .switch input:checked + .slider::before {
      transform: translate(14px, -50%);
      background: var(--accent);
    }
    .proto-divider {
      width: 1px; height: 30px;
      background: #2a2a28;
      align-self: flex-end;
      margin: 0.1rem 0;
    }
    .proto-badge {
      font-family: 'Metropolis', var(--ff);
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      opacity: 0.6;
      margin-bottom: 0.15rem;
    }
  </style>
</head>
<body>

<!-- CUSTOM CURSOR -->
<div class="cursor" id="cur"></div>

<!-- HERO -->
<section class="hero" id="hero">
  <canvas id="dot-canvas"></canvas>

  <div class="hero-content">
    <p class="hero-eyebrow">Creative Studio — Toronto</p>
    <h1 class="hero-h1" id="hero-h1" aria-label="We Do Impossible"></h1>
    <p class="hero-sub">Twenty-five years of campaigns, digital experiences, and brand moments that changed how people feel about the brands they love.</p>
  </div>

  <span class="hero-location">Est. 1999</span>
  <span class="hero-scroll">Scroll to explore</span>
</section>

<!-- PROTOTYPE CONTROLS -->
<div class="proto-panel">
  <span class="proto-badge">Prototype</span>
  <p class="proto-label">Effects</p>
  <label class="proto-toggle">
    <span>Dot Grid</span>
    <label class="switch">
      <input type="checkbox" id="tog-grid" checked>
      <span class="slider"></span>
    </label>
  </label>
  <label class="proto-toggle">
    <span>Scramble</span>
    <label class="switch">
      <input type="checkbox" id="tog-scramble" checked>
      <span class="slider"></span>
    </label>
  </label>
</div>

<script>
'use strict';

/* ─────────────────────────────────────────────────────────────
   CUSTOM CURSOR
───────────────────────────────────────────────────────────── */
(function () {
  const cur = document.getElementById('cur');
  if (!cur || window.matchMedia('(hover: none)').matches) return;

  let mx = window.innerWidth / 2, my = window.innerHeight / 2;
  let cx = mx, cy = my;

  window.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });

  function tick() {
    cx += (mx - cx) * 0.14;
    cy += (my - cy) * 0.14;
    cur.style.transform = `translate(calc(${cx}px - 50%), calc(${cy}px - 50%))`;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // Enlarge on interactive elements
  document.addEventListener('mouseover', e => {
    if (e.target.closest('label, input, a, button')) cur.classList.add('large');
  });
  document.addEventListener('mouseout', e => {
    if (e.target.closest('label, input, a, button')) cur.classList.remove('large');
  });
})();


/* ─────────────────────────────────────────────────────────────
   DOT GRID
───────────────────────────────────────────────────────────── */
const DotGrid = (() => {
  const canvas = document.getElementById('dot-canvas');
  const ctx    = canvas.getContext('2d');

  const CONFIG = {
    spacing:    68,      // px between dots
    radius:     1.2,     // dot radius in px
    baseAlpha:  0.065,   // resting opacity
    peakAlpha:  0.38,    // opacity directly under cursor
    influence:  190,     // cursor influence radius in px
    color:      [250, 250, 248],  // off-white rgb
  };

  let W = 0, H = 0;
  let dots = [];
  let mouse = { x: -9999, y: -9999 };
  let enabled = true;

  function resize() {
    W = canvas.width  = canvas.offsetWidth;
    H = canvas.height = canvas.offsetHeight;
    buildDots();
  }

  function buildDots() {
    dots = [];
    const cols = Math.ceil(W / CONFIG.spacing) + 1;
    const rows = Math.ceil(H / CONFIG.spacing) + 1;
    const offX = (W % CONFIG.spacing) / 2;
    const offY = (H % CONFIG.spacing) / 2;
    for (let r = 0; r <= rows; r++) {
      for (let c = 0; c <= cols; c++) {
        dots.push({ x: offX + c * CONFIG.spacing, y: offY + r * CONFIG.spacing });
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    if (!enabled) return;

    const [r, g, b] = CONFIG.color;
    const inf2 = CONFIG.influence * CONFIG.influence;

    for (const d of dots) {
      const dx   = d.x - mouse.x;
      const dy   = d.y - mouse.y;
      const dist2 = dx * dx + dy * dy;

      let alpha = CONFIG.baseAlpha;
      if (dist2 < inf2) {
        const t = 1 - dist2 / inf2;             // 0→1 as cursor approaches
        const smooth = t * t * (3 - 2 * t);     // smoothstep
        alpha = CONFIG.baseAlpha + smooth * (CONFIG.peakAlpha - CONFIG.baseAlpha);
      }

      ctx.beginPath();
      ctx.arc(d.x, d.y, CONFIG.radius, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
      ctx.fill();
    }
  }

  function loop() { draw(); requestAnimationFrame(loop); }

  function init() {
    window.addEventListener('resize', resize);
    window.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      mouse.x = e.clientX - rect.left;
      mouse.y = e.clientY - rect.top;
    });
    resize();
    loop();
  }

  return {
    init,
    setEnabled(v) { enabled = v; },
  };
})();


/* ─────────────────────────────────────────────────────────────
   TYPE SCRAMBLE
───────────────────────────────────────────────────────────── */
const Scramble = (() => {
  const POOL    = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#@!%&';
  const LINES   = ['WE DO', 'IMPOSSIBLE'];
  const DELAY   = 380;    // ms — matches site's 0.38s CSS delay
  const SETTLE  = 1200;   // total settle duration (ms)

  let el, enabled = true, running = false;

  function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function render(chars) {
    // chars is a flat array matching LINES joined by '\n'
    let lineIdx = 0, charIdx = 0;
    const spans = LINES.map(line => {
      const lineChars = [];
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (c === ' ') {
          lineChars.push(' ');
        } else {
          lineChars.push(chars[charIdx++] ?? c);
        }
      }
      return `<span>${lineChars.join('')}</span>`;
    });
    el.innerHTML = spans.join('<br>');
  }

  function run() {
    if (!el) return;
    running = true;
    el.classList.add('ready');

    // Build flat char list (skip spaces)
    const flat = [];
    for (const line of LINES) {
      for (const c of line) { if (c !== ' ') flat.push(c); }
    }

    // Assign lock times: staggered left→right + slight jitter
    const lockTimes = flat.map((_, i) => {
      const progress = i / flat.length;
      return progress * SETTLE * 0.75 + Math.random() * SETTLE * 0.25;
    });

    let start = null;
    const current = flat.map(() => rand(POOL));  // start randomised

    function frame(ts) {
      if (!start) start = ts;
      const elapsed = ts - start;

      let allDone = true;
      for (let i = 0; i < flat.length; i++) {
        if (elapsed >= lockTimes[i]) {
          current[i] = flat[i];
        } else {
          current[i] = rand(POOL);
          allDone = false;
        }
      }

      render(current);

      if (!allDone) {
        requestAnimationFrame(frame);
      } else {
        running = false;
      }
    }

    requestAnimationFrame(frame);
  }

  function showStatic() {
    // Show final text instantly, no scramble
    el.classList.add('ready');
    render(LINES.flatMap(l => [...l]).filter(c => c !== ' '));
    // Actually, just set the clean lines:
    el.innerHTML = LINES.map(l => `<span>${l}</span>`).join('<br>');
  }

  function init() {
    el = document.getElementById('hero-h1');
    if (!el) return;

    if (enabled) {
      setTimeout(run, DELAY);
    } else {
      el.style.opacity = '0';
      el.style.transform = 'translateY(1rem)';
      el.style.transition = 'opacity 1s cubic-bezier(0.16,1,0.3,1), transform 1s cubic-bezier(0.16,1,0.3,1)';
      setTimeout(() => {
        showStatic();
        el.style.opacity = '1';
        el.style.transform = 'translateY(0)';
      }, DELAY);
    }
  }

  return {
    init,
    replay() {
      if (!el || running) return;
      el.classList.remove('ready');
      el.style.opacity = '0';
      setTimeout(() => {
        el.style.opacity = '';
        if (enabled) {
          run();
        } else {
          showStatic();
          el.classList.add('ready');
        }
      }, 120);
    },
    setEnabled(v) {
      enabled = v;
      if (!v && !running && el) showStatic();
    },
  };
})();


/* ─────────────────────────────────────────────────────────────
   TOGGLE CONTROLS
───────────────────────────────────────────────────────────── */
document.getElementById('tog-grid').addEventListener('change', e => {
  DotGrid.setEnabled(e.target.checked);
});

document.getElementById('tog-scramble').addEventListener('change', e => {
  Scramble.setEnabled(e.target.checked);
  Scramble.replay();
});


/* ─────────────────────────────────────────────────────────────
   BOOT
───────────────────────────────────────────────────────────── */
DotGrid.init();
Scramble.init();
</script>
</body>
</html>
